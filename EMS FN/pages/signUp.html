





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa; 
            margin: 0;
        }
        .container {
            max-width: 500px; 
        }

    </style>

</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Sign Up</h2>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>
            <button type="button" class="btn btn-primary" id="btnSave">Sign Up</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='signIn.html'">Sign In</button>
        </form>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/lib/jquery-3.7.1.min.js"></script>

    <script>
        $('#btnSave').click(function () {
            const eventData = {
                name: $('#name').val(),
                email: $('#email').val(),
                password: $('#password').val(),
            };

            $.ajax({
                url: 'http://localhost:8080/EMS_Web_exploded/api/v1/signup',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(eventData),
                success: function (response) {
                    alert(response.message || "Data saved successfully.");
                    window.location.href = 'signIn.html';
                },
                error: function () {
                    alert("Save Unsuccessful");
                }
            });

        });
    </script>

</body>
</html>

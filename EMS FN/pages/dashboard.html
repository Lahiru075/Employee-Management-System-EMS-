<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            border-radius: 5px;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        #imagePreview {
            max-width: 200px;
            margin-top: 10px;
            display: none;
        }

        .buttons {
            display: flex;
            gap: 30px;
        }

        .btn {
            border: none;
            color: white;
            transition: background-color 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .table-container {
            margin-top: 50px;
            padding: 20px;
        }

        table {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #007bff;
            color: white;
        }

        td img {
            max-width: 100px;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="text-center mb-4">Employee Management</h2>
        <form id="employeeForm">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
            </div>
            <div class="mb-3">
                <label for="salary" class="form-label">Salary</label>
                <input type="text" class="form-control" id="salary" placeholder="Enter Salry" required>
            </div>
            <div class="mb-3">
            <label for="image" class="form-label">Upload Image</label>
                <input type="file" class="form-control" id="image" accept="image/*" required>
                <img id="imagePreview" src="" alt="Image Preview" style="display: none; margin-top: 10px; width: 60px;">
            </div>
            <div class="buttons mb-3">
                <button type="button" id="btnSave" class="btn btn-primary w-100" style="background-color: #007bff;">Save</button>
                <button type="button" id="btnUpdate" class="btn btn-secondary w-100" style="background-color: #6c757d;">Update</button>
                <button type="button" id="btnDelete" class="btn btn-danger w-100" style="background-color: #dc3545;">Delete</button>
                <button type="button" id="btnClear" class="btn btn-warning w-100" style="background-color: #ffc107;">Clear</button>
            </div>
        </form>
        <div class="container table-container">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>SALARY</th>
                        <th>Image</th>
                    </tr>
                </thead>
                <tbody id="tableBody">

                </tbody>
            </table>
        </div>
    </div>

    <script src="../assets/lib/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            var email = localStorage.getItem('uemail');

            if (!email) {
                window.location.href = 'signin.html';
            } else {
                alert('Welcome to the dashboard, ' + email);
            }
        });

        $('#logout-btn').on('click', function () {

            localStorage.removeItem('uemail');

            window.location.href = 'signIn.html';
        });

        let id;

        $(document).ready(function () {
            loadEmployees();

            $("#image").on("change", function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        $("#imagePreview").attr("src", e.target.result).show();
                    };
                    reader.readAsDataURL(file);
                }
            });


        });

        function loadEmployees() {
            $.ajax({
                url: 'http://localhost:8080/EMS_Web_exploded/api/v1/dashboard',
                method: 'GET',
                success: function (response) {
                    alert("Data Fetched");
                    let data = response;
                    let table = $("#tableBody");
                    table.empty();
                    for (let i = 0; i < data.length; i++) {
                        let row = `
                            <tr>
                                <td>${data[i].id}</td>
                                <td>${data[i].name}</td>
                                <td>${data[i].email}</td>
                                <td>${data[i].salary}</td>
                                <td><img src="http://localhost:8080/EMS_Web_exploded/${data[i].image}" alt="Employee Image" style="width: 80px; height: auto;"></td>
                            </tr>
                        `;
                        table.append(row);
                    }
                },
                error: function (error) {
                    alert("Error: " + error);
                }
            });
        }

        $('#btnSave').on('click', function () {
            let name = $("#name").val();
            let email = $("#email").val();
            let salary = $("#salary").val();
            let file = $("#image")[0].files[0];

            let formData = new FormData();
            formData.append("name", name);
            formData.append("email", email);
            formData.append("salary", salary);
            formData.append("image", file);

            $.ajax({
                method: 'POST',
                url: 'http://localhost:8080/EMS_Web_exploded/api/v1/dashboard',
                data: formData,
                contentType: false,
                processData: false,
                success: function (response) {
                    if (response.code == 200) {
                        alert("Successfully saved");
                        clearForm();
                        loadEmployees();
                    } else {
                        alert("Error");
                    }
                },
                error: function () {
                    alert("Fail to save employee");
                }
            });
        });

        $('#btnUpdate').on('click', function () {
            let name = $("#name").val();
            let email = $("#email").val();
            let salary = $("#salary").val();
            let file = $("#image")[0].files[0];

            let formData = new FormData();
            formData.append("id", id);
            formData.append("name", name);
            formData.append("email", email);
            formData.append("salary", salary)
            formData.append("image", file);

            $.ajax({
                method: 'PUT',
                url: 'http://localhost:8080/EMS_Web_exploded/api/v1/dashboard',
                data: formData,
                contentType: false,
                processData: false,
                success: function (response) {
                    if (response.code == 200) {
                        alert("Successfully updated");
                        clearForm();
                        loadEmployees();
                    } else {
                        alert("Error");
                    }
                },
                error: function (error) {
                    alert("Fail to update employee" + error);
                }
            });
        });


        $('#btnDelete').on('click', function () {
            $.ajax({
                method: 'DELETE',
                url: 'http://localhost:8080/EMS_Web_exploded/api/v1/dashboard?id=' + id,
                success: function (response) {
                    if (response.code == 200) {
                        alert("Successfully deleted");
                        clearForm();
                        loadEmployees();
                    } else {
                        alert("Error");
                    }
                },
                error: function () {
                    alert("Fail to delete employee");
                }
            });
        });


        $('#tableBody').on('click', 'tr', function () {
            var cells = $(this).children('td');
            id = cells.eq(0).text();
            $('#name').val(cells.eq(1).text());
            $('#email').val(cells.eq(2).text());
            $('#salary').val(cells.eq(3).text());
            var imageSrc = cells.eq(4).find('img').attr('src');
            if (imageSrc) {
                $("#imagePreview").attr("src", imageSrc).show();
            }

            console.log(id);

        });

        $('#btnClear').on('click', function () {
            clearForm();
        });

        function clearForm() {
            $('#id').val('');
            $('#name').val('');
            $('#email').val('');
            $('#salary').val('');
            $('#image').val('');
            $('#imagePreview').attr('src', '').hide();
        }

    </script>

</body>

</html>
